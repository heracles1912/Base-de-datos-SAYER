<script>
  let indexActividadEditando = null;
  let indexEditando = null;
    let unsubscribeDoc = null;
const firebaseConfig = {
  apiKey: "AIzaSyCyJ7uYtyGVpGx_VLBLJkCdsjJBcOrigw0",
  authDomain: "base-de-datos-sayer.firebaseapp.com",
  projectId: "base-de-datos-sayer",
  storageBucket: "base-de-datos-sayer.firebasestorage.app",
  messagingSenderId: "753055408963",
  appId: "1:753055408963:web:6a1cb4a1e7de8ddbec45f6",
  measurementId: "G-771QQ2670S"
};

const app = firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let registros = [];
const meses = {
  enero:0, febrero:1, marzo:2, abril:3,
  mayo:4, junio:5, julio:6, agosto:7,
  septiembre:8, octubre:9, noviembre:10, diciembre:11
};

let personaActiva = null;
auth.onAuthStateChanged(user => {
  if(user){
    escucharRegistros(); // 👈 nuevo
    mostrar("registros");
  } else {
    mostrar("login");
  }
});

let registroActivo = null;

// ================= GUARDAR MES =================
function guardarRegistro(){

  const mes = document.getElementById("MES").value;
const anio = document.getElementById("anio").value;

  if(!mes || !anio){
    alert("Completa mes y año");
    return;
  }

  const mesLimpio = mes.toLowerCase();

  const nombreMes = mesLimpio.charAt(0).toUpperCase() + mesLimpio.slice(1) + " " + anio;

  db.collection("registros").add({
    mes: nombreMes,
    mesNum: meses[mesLimpio],
    anio: parseInt(anio),
    personas: []
  });

  document.getElementById("MES").value = "";
document.getElementById("anio").value = "";
}

// ================= MOSTRAR MESES =================
function actualizarRegistros(){
  
  const lista = document.getElementById("listaRegistros");
lista.innerHTML = "";
  registros.sort((a,b)=> {
  if(a.anio !== b.anio) return a.anio - b.anio;
  return a.mesNum - b.mesNum;
});
  registros.forEach((r,i)=>{

    lista.innerHTML += `
    <li class="itemMes" onclick="seleccionarRegistro('${r.id}')">

      <div class="nombreMes">
        <span class="iconoMes">📁</span> ${r.mes}
      </div>

      <div class="accionesPersona">
        <button onclick="event.stopPropagation(); eliminarRegistro('${r.id}')">🗑</button>
      </div>

    </li>`;
    
  });
}

function escucharRegistros(){

  db.collection("registros")
  .onSnapshot(snapshot => {

    registros = [];

    snapshot.forEach(doc => {
      registros.push({
        id: doc.id,
        ...doc.data()
      });
    });

    actualizarRegistros();
  });
}
function eliminarRegistro(id){
  if(confirm("Eliminar este mes?")){
    db.collection("registros").doc(id).delete();
  }
}
function obtenerFechaMes(texto){

  const [mesRaw, anio] = texto.trim().split(" ");

  const mes = mesRaw.toLowerCase().trim();

  const meses = {
    enero:0, febrero:1, marzo:2, abril:3,
    mayo:4, junio:5, julio:6, agosto:7,
    septiembre:8, octubre:9, noviembre:10, diciembre:11
  };

  return new Date(parseInt(anio), meses[mes]);
}
// ================= SELECCIONAR MES =================
function seleccionarRegistro(id){

  // 🔥 cancelar escucha anterior
  if(unsubscribeDoc){
    unsubscribeDoc();
  }

  // 🔥 escuchar documento en tiempo real
  unsubscribeDoc = db.collection("registros")
    .doc(id)
    .onSnapshot(doc => {

      registroActivo = {
        id: doc.id,
        ...doc.data()
      };

      document.getElementById("tituloMes").innerText = "MES: " + registroActivo.mes;

      actualizarPersonas();
      llenarSelects();

      // 👇 si estás dentro de una persona, refresca actividades
      if(personaActiva !== null){
        mostrarActividades();
      }
    });

  mostrar("pozos");
}

// ================= POZOS =================
function guardarPersona(){

  const nombre = document.getElementById("nombrePersona").value;
  const puesto = document.getElementById("puestoPersona").value;

  if(!nombre || !puesto){
    alert("Completa nombre y puesto");
    return;
  }

  registroActivo.personas.push({
    nombre,
    puesto,
    actividades:[]
  });

  db.collection("registros")
    .doc(registroActivo.id)
    .update({
      personas: registroActivo.personas
    });

  document.getElementById("nombrePersona").value = "";
  document.getElementById("puestoPersona").value="";

  actualizarPersonas();
llenarSelects();
}

// ================= MOSTRAR POZOS =================
function actualizarPersonas(){

  const lista = document.getElementById("listaPersonas");
lista.innerHTML = "";

  registroActivo.personas.forEach((p,i)=>{

    lista.innerHTML += `
    <li class="itemPersona" onclick="abrirPersona(${i})">

      <div class="infoPersona">
  <span class="iconoPersona">👤</span> ${p.nombre}
  <br><br>
  <small style="color:#777;">${p.puesto}</small>
</div>

      <div class="accionesPersona">
  <button onclick="event.stopPropagation(); abrirEditar(${i})">✏️</button>
  <button onclick="event.stopPropagation(); eliminarPersona(${i})">🗑</button>
</div>

    </li>`;
    
  });
}
function abrirEditar(i){

  indexEditando = i;

  const persona = registroActivo.personas[i];

  document.getElementById("editNombre").value = persona.nombre;
  document.getElementById("editPuesto").value = persona.puesto;

  document.getElementById("modalEditar").classList.remove("oculto");
}
// ================= ELIMINAR =================
function eliminarPersona(i){
  registroActivo.personas.splice(i,1);
 
  db.collection("registros")
  .doc(registroActivo.id)
  .update({
    personas: registroActivo.personas
  });
  actualizarPersonas();
}
function editarPersona(i){

  const persona = registroActivo.personas[i];

  const lista = document.getElementById("listaPersonas");

  lista.children[i].innerHTML = `
    
    <input id="editNombre_${i}" value="${persona.nombre}">
    <input id="editPuesto_${i}" value="${persona.puesto}">

    <button onclick="guardarEdicion(${i})">💾 Guardar</button>
  `;
}
function guardarEdicion(){

  const nombre = document.getElementById("editNombre").value;
  const puesto = document.getElementById("editPuesto").value;

  registroActivo.personas[indexEditando].nombre = nombre;
  registroActivo.personas[indexEditando].puesto = puesto;

  db.collection("registros")
    .doc(registroActivo.id)
    .update({
      personas: registroActivo.personas
    });

  cerrarModal();
}
function cerrarModal(){
  document.getElementById("modalEditar").classList.add("oculto");
}
function eliminarActividad(i){
 registroActivo.personas[personaActiva].actividades.splice(i,1);

  db.collection("registros")
  .doc(registroActivo.id)
  .update({
    personas: registroActivo.personas
  });
  mostrarActividades();
}

// ================= GUARDADO =================

// ================= NAVEGACIÓN =================
function mostrar(id){

  // ocultar login manualmente
  document.getElementById("login").style.display = "none";

  document.querySelectorAll(".seccion").forEach(s=>s.classList.remove("activo"));
  document.getElementById(id).classList.add("activo");

  // si quieres volver a mostrar login
  if(id === "login"){
    document.getElementById("login").style.display = "flex";
  }
}

function volverRegistros(){
  mostrar("registros");
}
function abrirPersona(i){
  personaActiva = i;

  const lista = document.getElementById("listaActividades");
lista.innerHTML = "";

  const persona =registroActivo.personas[i];

 document.getElementById("tituloPersona").innerText = "Persona: " + persona.nombre;

  mostrarActividades();

  mostrar("detallePersona"); // 🔥 cambio de pantalla
}
function volverAPersonas(){
  mostrar("pozos");
}
function guardarActividad(){

  if(personaActiva === null){
    alert("Selecciona una persona primero");
    return;
  }

  const nombre = actividadNombre.value;
  const inicio = horaInicio.value;
  const fecha = fechaActividad.value;

  if(!nombre || !inicio || !fecha){
    alert("Completa actividad, hora inicio y fecha");
    return;
  }

  registroActivo.personas[personaActiva].actividades.push({
    nombre,
    inicio,
    fin: null,
    fecha
  });

  actividadNombre.value="";
  horaInicio.value="";
  fechaActividad.value="";


  db.collection("registros")
  .doc(registroActivo.id)
  .update({
    personas: registroActivo.personas
  });
  mostrarActividades();
}
function mostrarActividades(){

  const lista = document.getElementById("listaActividades");
lista.innerHTML = "";

  const persona = registroActivo.personas[personaActiva];

  // 🔥 AQUÍ VA
  persona.actividades.sort((a,b)=> new Date(a.fecha) - new Date(b.fecha));

  persona.actividades.forEach((a,i)=>{

    lista.innerHTML += `
    <tr>

      <td>📝 ${a.nombre}</td>
      <td>📅 ${a.fecha || "-"}</td>
      <td>${formatoHora(a.inicio)}</td>

      <td>
  ${
    !a.fin
  ? `<div class="finPendiente">
  <span>⏱ En proceso</span>
  <input type="date" id="fechaFin_${i}">
  <input type="time" id="fin_${i}">
  <button onclick="finalizarActividad(${i})">✔</button>
</div>`
    : formatoHora(a.fin)
  }
</td>

     <td>${calcularHoras(a.inicio, a.fin, a.fecha, a.fechaFin)}</td>
      <td>
  <div class="accionesTabla">
    <button class="btnIcono" onclick="editarActividad(${i})">✏️</button>
    <button class="btnIcono" onclick="eliminarActividad(${i})">🗑</button>
  </div>
</td>
    </tr>`;
  });
}
function editarActividad(i){

  indexActividadEditando = i;

  const actividad = registroActivo.personas[personaActiva].actividades[i];

  document.getElementById("editActNombre").value = actividad.nombre;
  document.getElementById("editActFecha").value = actividad.fecha;
  document.getElementById("editActInicio").value = actividad.inicio;

  document.getElementById("editActFechaFin").value = actividad.fechaFin || actividad.fecha;
  document.getElementById("editActFin").value = actividad.fin || "";

  document.getElementById("modalActividad").classList.remove("oculto");
}
function guardarActividadEditada(){

  const actividad = registroActivo.personas[personaActiva].actividades[indexActividadEditando];

  const nombre = document.getElementById("editActNombre").value;
  const fechaInicio = document.getElementById("editActFecha").value;
  const inicio = document.getElementById("editActInicio").value;

  const fechaFin = document.getElementById("editActFechaFin").value;
  const fin = document.getElementById("editActFin").value;

  if(!nombre || !fechaInicio || !inicio){
    alert("Completa los datos obligatorios");
    return;
  }

  // 🔥 VALIDACIÓN DE TIEMPOS
  if(fin){
    const inicioDate = new Date(`${fechaInicio}T${inicio}`);
    const finDate = new Date(`${fechaFin || fechaInicio}T${fin}`);

    if(finDate < inicioDate){
      alert("La hora final no puede ser menor a la inicial");
      return;
    }
  }

  actividad.nombre = nombre;
  actividad.fecha = fechaInicio;
  actividad.inicio = inicio;
  actividad.fin = fin || null;
  actividad.fechaFin = fin ? (fechaFin || fechaInicio) : null;

  db.collection("registros")
    .doc(registroActivo.id)
    .update({
      personas: registroActivo.personas
    });

  cerrarModalActividad();
  mostrarActividades();
}
function cerrarModalActividad(){
  document.getElementById("modalActividad").classList.add("oculto");
}
function finalizarActividad(i){

  const fin = document.getElementById("fin_" + i).value;
  const fechaFin = document.getElementById("fechaFin_" + i).value;

  if(!fin){
    alert("Ingresa hora de finalización");
    return;
  }

  const actividad = registroActivo.personas[personaActiva].actividades[i];

  const inicioDate = new Date(`${actividad.fecha}T${actividad.inicio}`);
  const finDate = new Date(`${fechaFin || actividad.fecha}T${fin}`);

  // 🔥 VALIDACIÓN AQUÍ (solo 1 vez)
  if(finDate < inicioDate){
    alert("La hora final no puede ser menor a la inicial");
    return;
  }

  actividad.fin = fin;
  actividad.fechaFin = fechaFin || actividad.fecha;

  db.collection("registros")
    .doc(registroActivo.id)
    .update({
      personas: JSON.parse(JSON.stringify(registroActivo.personas))
    });

  mostrarActividades();
}
function calcularHoras(inicio, fin, fechaInicio, fechaFin){

  if(!fin) return "--";

  const totalMin = minutos(inicio, fin, fechaInicio, fechaFin);

  let dias = Math.floor(totalMin / (60*24));
  let horas = Math.floor((totalMin % (60*24)) / 60);
  let minutosRest = totalMin % 60;

  let resultado = "";

  if(dias > 0){
    resultado += `${dias}d `;
  }

  resultado += `${horas}h ${minutosRest}m`;

  return resultado;
}
function compararPersonas(){

  const p1 = document.getElementById("persona1").value;
  const p2 = document.getElementById("persona2").value;

  if(!p1 || !p2){
    alert("Selecciona ambas personas");
    return;
  }

  if(p1 === p2){
    alert("Selecciona personas diferentes");
    return;
  }

  const persona1 = registroActivo.personas.find(p => p.nombre === p1);
  const persona2 = registroActivo.personas.find(p => p.nombre === p2);

  let html = "";

  persona1.actividades.forEach(a1 => {

    // 🔥 NORMALIZAR NOMBRE (CLAVE)
    const nombreAct = a1.nombre.toLowerCase().trim();

    const a2 = persona2.actividades.find(a => 
      a.nombre.toLowerCase().trim() === nombreAct
    );

    // 🔥 VALIDAR QUE AMBAS TERMINARON
    if(a2 && a1.fin && a2.fin){

      const t1 = minutos(a1.inicio, a1.fin, a1.fecha, a1.fechaFin);
      const t2 = minutos(a2.inicio, a2.fin, a2.fecha, a2.fechaFin);

      let estado = "";
      let clase = "";

      if(t1 > t2){
        estado = `${p1} tardó más`;
        clase = "rojo";
      } 
      else if(t2 > t1){
        estado = `${p2} tardó más`;
        clase = "rojo";
      } 
      else {
        estado = "Mismo tiempo";
        clase = "verde";
      }

      // 🔥 DISEÑO BONITO
      html += `
        <div class="cardResultado ${clase}">
          <div class="tituloActividad">🛠 ${a1.nombre}</div>
          <div class="detalleResultado">${estado}</div>
          <div class="tiempos">
            ${p1}: ${formatoHoras(t1)} | ${p2}: ${formatoHoras(t2)}
          </div>
        </div>
      `;
    }

  });

  document.getElementById("resultadoComparacion").innerHTML =
    html || "<div class='sinResultados'>No hay actividades en común</div>";
}
function minutos(inicio, fin, fechaInicio, fechaFin){

  if(!fin || !fechaInicio) return 0;

  const inicioDate = new Date(`${fechaInicio}T${inicio}`);
  const finDate = new Date(`${fechaFin || fechaInicio}T${fin}`);

  if(finDate < inicioDate){
    return 0; // 👈 sin alert
  }

  return Math.floor((finDate - inicioDate) / 60000);
}
function formatoHora(hora){

  let [h,m] = hora.split(":").map(Number);

  let sufijo = h >= 12 ? "PM" : "AM";

  h = h % 12;
  if(h === 0) h = 12;

  return `${h}:${m.toString().padStart(2,"0")} ${sufijo}`;
}

select2.innerHTML = `<option value="">Seleccionar persona</option>`;

function totalHorasPersona(persona){

  let total = 0;

  persona.actividades.forEach(a => {
    if(a.fin){
      total += minutos(a.inicio, a.fin, a.fecha, a.fechaFin);
    }
  });

  return total; // en minutos
}
function formatoHoras(min){

  let h = Math.floor(min / 60);
  let m = min % 60;

  return `${h}h ${m}m`;
}
function generarDashboardPersonas(){

  let html = `<div class="gridPersonas">`;

  registroActivo.personas.forEach(p => {

    let totalMin = totalHorasPersona(p);
    let totalHoras = formatoHoras(totalMin);
    let actividades = p.actividades.length;

    html += `
    <div class="cardPersona">

      <div class="headerPersona">
        <div>
          <h3>${p.nombre}</h3>
          <span class="puesto">${p.puesto}</span>
        </div>
      </div>

      <div class="statsPersona">
        <div>
          <strong>${totalHoras}</strong>
          <span>Horas</span>
        </div>
        <div>
          <strong>${actividades}</strong>
          <span>Actividades</span>
        </div>
      </div>

      <div class="barraFondo">
        <div class="barraProgreso" style="width:${Math.min(totalMin/5,100)}%"></div>
      </div>

      <div class="actividadesMini">
        ${p.actividades.slice(-3).map(a => `
          <div class="miniItem">
            📝 ${a.nombre}
          </div>
        `).join("")}
      </div>

    </div>`;
  });

  html += `</div>`;

  document.getElementById("ranking").innerHTML = html;
}
function generarGrafica(){

  let contenedor = document.getElementById("grafica");
  contenedor.innerHTML = "";

  let lista = registroActivo.personas;

  lista.forEach(p => {

    let total = totalHorasPersona(p);

    let barra = `
    <div style="margin-bottom:10px;">
      <strong>${p.nombre}</strong>
      <div style="
        height:20px;
        background:#2e7d32;
        width:${Math.min(total/5, 300)}px;
        border-radius:5px;
      "></div>
      ${formatoHoras(total)}
    </div>
    `;

    contenedor.innerHTML += barra;
  });
}
