<script>
const firebaseConfig = {
  apiKey: "AIzaSyCyJ7uYtyGVpGx_VLBLJkCdsjJBcOrigw0",
  authDomain: "base-de-datos-sayer.firebaseapp.com",

  appId: "1:753055408963:web:6a1cb4a1e7de8ddbec45f6",
  measurementId: "G-771QQ2670S"
};

const app = firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
let registros = [];
const meses = {
  enero:0, febrero:1, marzo:2, abril:3,
  mayo:4, junio:5, julio:6, agosto:7,
  septiembre:8, octubre:9, noviembre:10, diciembre:11
};

let personaActiva = null;
auth.onAuthStateChanged(user => {
  if(user){
    escucharRegistros(); // 👈 nuevo
    mostrar("registros");
  } else {
    mostrar("login");
  }
});

let registroActivo = null;

// ================= GUARDAR MES =================
function guardarRegistro(){

  const mes = document.getElementById("MES").value;
const anio = document.getElementById("anio").value;

  if(!mes || !anio){
    alert("Completa mes y año");
    return;
  }

  const mesLimpio = mes.toLowerCase();

  const nombreMes = mesLimpio.charAt(0).toUpperCase() + mesLimpio.slice(1) + " " + anio;

  db.collection("registros").add({
    mes: nombreMes,
    mesNum: meses[mesLimpio],
    anio: parseInt(anio),
    personas: []
  });

  document.getElementById("MES").value = "";
document.getElementById("anio").value = "";
}

// ================= MOSTRAR MESES =================
function actualizarRegistros(){
  
  const lista = document.getElementById("listaRegistros");
lista.innerHTML = "";
  registros.sort((a,b)=> {
  if(a.anio !== b.anio) return a.anio - b.anio;
  return a.mesNum - b.mesNum;
});
  registros.forEach((r,i)=>{

    lista.innerHTML += `
    <li class="itemMes" onclick="seleccionarRegistro('${r.id}')">

      <div class="nombreMes">
        <span class="iconoMes">📁</span> ${r.mes}
      </div>

      <div class="accionesPersona">
        <button onclick="event.stopPropagation(); eliminarRegistro('${r.id}')">🗑</button>
      </div>

    </li>`;
    
  });
}

function escucharRegistros(){

  db.collection("registros")
  .onSnapshot(snapshot => {

    registros = [];

    snapshot.forEach(doc => {
      registros.push({
        id: doc.id,
        ...doc.data()
      });
    });

    actualizarRegistros();
  });
}
function eliminarRegistro(id){
  if(confirm("Eliminar este mes?")){
    db.collection("registros").doc(id).delete();
  }
}
function obtenerFechaMes(texto){

  const [mesRaw, anio] = texto.trim().split(" ");

  const mes = mesRaw.toLowerCase().trim();

  const meses = {
    enero:0, febrero:1, marzo:2, abril:3,
    mayo:4, junio:5, julio:6, agosto:7,
    septiembre:8, octubre:9, noviembre:10, diciembre:11
  };

  return new Date(parseInt(anio), meses[mes]);
}
// ================= SELECCIONAR MES =================
function seleccionarRegistro(id){

  registroActivo = registros.find(r => r.id === id);

  if(!registroActivo){
    alert("Error cargando registro");
    return;
  }

  document.getElementById("tituloMes").innerText = "MES: " + registroActivo.mes;

  document.getElementById("resultadoComparacion").innerHTML = "";

  actualizarPersonas();
  mostrar("pozos");
  llenarSelects();
}

// ================= POZOS =================
function guardarPersona(){

  const nombre = document.getElementById("nombrePersona").value;
  const puesto = document.getElementById("puestoPersona").value;

  if(!nombre || !puesto){
    alert("Completa nombre y puesto");
    return;
  }

  registroActivo.personas.push({
    nombre,
    puesto,
    actividades:[]
  });

  db.collection("registros")
    .doc(registroActivo.id)
    .update({
      personas: registroActivo.personas
    });

  document.getElementById("nombrePersona").value = "";
  document.getElementById("puestoPersona").value="";

  actualizarPersonas();
llenarSelects();
}

// ================= MOSTRAR POZOS =================
function actualizarPersonas(){

  const lista = document.getElementById("listaPersonas");
lista.innerHTML = "";

  registroActivo.personas.forEach((p,i)=>{

    lista.innerHTML += `
    <li class="itemPersona" onclick="abrirPersona(${i})">

      <div class="infoPersona">
  <span class="iconoPersona">👤</span> ${p.nombre}
  <br>
  <small style="color:#777;">${p.puesto}</small>
</div>

        <button onclick="event.stopPropagation(); eliminarPersona(${i})">🗑</button>
      </div>

    </li>`;
    
  });
}
// ================= ELIMINAR =================
function eliminarPersona(i){
  registroActivo.personas.splice(i,1);
 
  db.collection("registros")
  .doc(registroActivo.id)
  .update({
    personas: registroActivo.personas
  });
  actualizarPersonas();
}

function eliminarActividad(i){
 registroActivo.personas[personaActiva].actividades.splice(i,1);

  db.collection("registros")
  .doc(registroActivo.id)
  .update({
    personas: registroActivo.personas
  });
  mostrarActividades();
}

// ================= NAVEGACIÓN =================
function mostrar(id){

  // ocultar login manualmente
  document.getElementById("login").style.display = "none";

  document.querySelectorAll(".seccion").forEach(s=>s.classList.remove("activo"));
  document.getElementById(id).classList.add("activo");

  // si quieres volver a mostrar login
  if(id === "login"){
    document.getElementById("login").style.display = "flex";
  }
}

function volverRegistros(){
  mostrar("registros");
}
function abrirPersona(i){
  personaActiva = i;

  const lista = document.getElementById("listaActividades");
lista.innerHTML = "";

  const persona =registroActivo.personas[i];

 document.getElementById("tituloPersona").innerText = "Persona: " + persona.nombre;

  mostrarActividades();

  mostrar("detallePersona"); // 🔥 cambio de pantalla
}
function volverAPersonas(){
  mostrar("pozos");
}
function guardarActividad(){

  if(personaActiva === null){
    alert("Selecciona una persona primero");
    return;
  }

  const nombre = actividadNombre.value;
  const inicio = horaInicio.value;
  const fecha = fechaActividad.value;

  if(!nombre || !inicio || !fecha){
    alert("Completa actividad, hora inicio y fecha");
    return;
  }

  registroActivo.personas[personaActiva].actividades.push({
    nombre,
    inicio,
    fin: null,
    fecha
  });

  actividadNombre.value="";
  horaInicio.value="";
  fechaActividad.value="";


  db.collection("registros")
  .doc(registroActivo.id)
  .update({
    personas: registroActivo.personas
  });
  mostrarActividades();
}
function mostrarActividades(){

  const lista = document.getElementById("listaActividades");
lista.innerHTML = "";

  const persona = registroActivo.personas[personaActiva];

  // 🔥 AQUÍ VA
  persona.actividades.sort((a,b)=> new Date(a.fecha) - new Date(b.fecha));

  persona.actividades.forEach((a,i)=>{

    lista.innerHTML += `
    <tr>

      <td>📝 ${a.nombre}</td>
      <td>📅 ${a.fecha || "-"}</td>
      <td>${formatoHora(a.inicio)}</td>

      <td>
  ${
    !a.fin
  ? `<div class="finPendiente">
  <span>⏱ En proceso</span>
  <input type="date" id="fechaFin_${i}">
  <input type="time" id="fin_${i}">
  <button onclick="finalizarActividad(${i})">✔</button>
</div>`
    : formatoHora(a.fin)
  }
</td>

     <td>${calcularHoras(a.inicio, a.fin, a.fecha, a.fechaFin)}</td>
      <td>
        <button onclick="eliminarActividad(${i})">🗑</button>
      </td>

    </tr>`;
  });
}
function finalizarActividad(i){

  const fin = document.getElementById("fin_" + i).value;
  const fechaFin = document.getElementById("fechaFin_" + i).value;

  if(!fin){
    alert("Ingresa hora de finalización");
    return;
  }

  const actividad = registroActivo.personas[personaActiva].actividades[i];

  actividad.fin = fin;
  actividad.fechaFin = fechaFin || actividad.fecha;


  db.collection("registros")
  .doc(registroActivo.id)
  .update({
    personas: registroActivo.personas
  });
  mostrarActividades();
}
function calcularHoras(inicio, fin, fechaInicio, fechaFin){

  if(!fin) return "--";

  const totalMin = minutos(inicio, fin, fechaInicio, fechaFin);

  let dias = Math.floor(totalMin / (60*24));
  let horas = Math.floor((totalMin % (60*24)) / 60);
  let minutosRest = totalMin % 60;

  let resultado = "";

  if(dias > 0){
    resultado += `${dias}d `;
  }

  resultado += `${horas}h ${minutosRest}m`;

  return resultado;
}
function compararPersonas(){

  const p1 = document.getElementById("persona1").value;
  const p2 = document.getElementById("persona2").value;
if(!p1 || !p2){
  alert("Selecciona ambas personas");
  return;
}
  const persona1 = registroActivo.personas.find(p => p.nombre === p1);
  const persona2 = registroActivo.personas.find(p => p.nombre === p2);

  let resultado = "";

  persona1.actividades.forEach(a1 => {

    const a2 = persona2.actividades.find(a => a.nombre === a1.nombre);

    if(a2 && a1.fin && a2.fin){

      const t1 = minutos(a1.inicio, a1.fin, a1.fecha, a1.fechaFin);
const t2 = minutos(a2.inicio, a2.fin, a2.fecha, a2.fechaFin);
      if(t1 > t2){
  resultado += `<span class="foco rojo"></span> ${a1.nombre}: ${p1} tardó más<br>`;
} 
else if(t2 > t1){
  resultado += `<span class="foco rojo"></span> ${a1.nombre}: ${p2} tardó más<br>`;
} 
else {
  resultado += `<span class="foco verde"></span> ${a1.nombre}: igual tiempo<br>`;
}
    }

  });

  document.getElementById("resultadoComparacion").innerHTML =
    resultado || "No hay actividades en común";
}
function minutos(inicio, fin, fechaInicio, fechaFin){

  if(!fin) return 0;

  const inicioDate = new Date(`${fechaInicio}T${inicio}`);
  const finDate = new Date(`${fechaFin || fechaInicio}T${fin}`);

  return Math.floor((finDate - inicioDate) / 60000);
}
function formatoHora(hora){

  let [h,m] = hora.split(":").map(Number);

  let sufijo = h >= 12 ? "PM" : "AM";

  h = h % 12;
  if(h === 0) h = 12;

  return `${h}:${m.toString().padStart(2,"0")} ${sufijo}`;
}
function llenarSelects(){

  const select1 = document.getElementById("persona1");
  const select2 = document.getElementById("persona2");

  select1.innerHTML = `<option value="">Seleccionar persona</option>`;
select2.innerHTML = `<option value="">Seleccionar persona</option>`;

 registroActivo.personas.forEach(p => {

  select1.innerHTML += `<option value="${p.nombre}">${p.nombre}</option>`;
  select2.innerHTML += `<option value="${p.nombre}">${p.nombre}</option>`;

});
}
function totalHorasPersona(persona){

  let total = 0;

  persona.actividades.forEach(a => {
    if(a.fin){
      total += minutos(a.inicio, a.fin, a.fecha, a.fechaFin);
    }
  });

  return total; // en minutos
}
function formatoHoras(min){

  let h = Math.floor(min / 60);
  let m = min % 60;

  return `${h}h ${m}m`;
}
function generarRanking(){

  let lista = registroActivo.personas.map(p => {
    return {
      nombre: p.nombre,
      minutos: totalHorasPersona(p)
    };
  });

  lista.sort((a,b) => b.minutos - a.minutos);

  let html = `<div class="cardAnalisis">
  <h2>📊 Análisis de productividad</h2>
  <h3>🏆 Ranking</h3>`;

  lista.forEach((p,i) => {

    let ancho = Math.min(p.minutos / 5, 100);

    html += `
    <div class="itemRanking">
      
      <div class="rankingTop">
        <span class="posicion">#${i+1}</span>
        <span class="nombre">${p.nombre}</span>
        <span class="horas">${formatoHoras(p.minutos)}</span>
      </div>

      <div class="barraFondo">
        <div class="barraProgreso" style="width:${ancho}%"></div>
      </div>

    </div>`;
  });

  html += `</div>`;

  document.getElementById("ranking").innerHTML = html;
}
function generarGrafica(){

  let contenedor = document.getElementById("grafica");
  contenedor.innerHTML = "";

  let lista = registroActivo.personas;

  lista.forEach(p => {

    let total = totalHorasPersona(p);

    let barra = `
    <div style="margin-bottom:10px;">
      <strong>${p.nombre}</strong>
      <div style="
        height:20px;
        background:#2e7d32;
        width:${Math.min(total/5, 300)}px;
        border-radius:5px;
      "></div>
      ${formatoHoras(total)}
    </div>
    `;

    contenedor.innerHTML += barra;
  });
}
function dashboard(){
  generarRanking();
 
}
function irAnalisis(){

  generarRanking();
  
  mostrar("analisis"); // 🔥 cambia de pantalla
}
function registro(){
  const email = document.getElementById("correo").value;
const pass = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, pass)
    .then(()=>{
      alert("Cuenta creada");
    })
    .catch(e => alert(e.message));
}
function login(){
  const email = document.getElementById("correo").value;
const pass = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, pass)
    .then(()=>{
      console.log("Login correcto");
    })
    .catch(e => {
      console.error(e);
      
      if(e.code === "auth/user-not-found"){
        alert("Usuario no existe");
      } else if(e.code === "auth/wrong-password"){
        alert("Contraseña incorrecta");
      } else if(e.code === "auth/invalid-email"){
        alert("Correo inválido");
      } else {
        alert(e.message);
      }
    });
}
function logout(){
  auth.signOut()
    .then(()=>{
      console.log("Sesión cerrada");
    })
    .catch(e => alert(e.message));
}
